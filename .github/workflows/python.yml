name: Python

# Builds the `ticoraw` Python package (crates/ticoraw-py) as abi3 wheels for Linux, macOS and
# Windows, tests every wheel on its own platform, and checks the Linux wheel against the
# public conformance samples.
#
# PATENT GATE: wheels contain a compiled JPEG XS / TicoRAW decoder, so they are NOT
# published, pending patent-licensing review (see the patent notice in README.md). They
# are built and tested here. They are uploaded as short-lived workflow artifacts ONLY when
# the repository variable ALLOW_BINARY_DISTRIBUTION is 'true' (any signed-in user can
# download the artifacts of a public repository); otherwise they never leave the runner.
# Only the source distribution is always kept as an artifact. The `publish` job runs only
# when BOTH hold:
#   1. the run was started by hand (workflow_dispatch) with the `publish` input ticked, and
#   2. the repository variable ALLOW_BINARY_DISTRIBUTION is set to 'true' (unset today).
# Do not remove or weaken either condition without that review.

on:
  push:
    branches: [main]
    paths:
      - crates/ticoraw/**
      - crates/ticoraw-dng/**
      - crates/ticoraw-py/**
      - conformance/**
      - .github/workflows/python.yml
  pull_request:
    paths:
      - crates/ticoraw/**
      - crates/ticoraw-dng/**
      - crates/ticoraw-py/**
      - conformance/**
      - .github/workflows/python.yml
  workflow_dispatch:
    inputs:
      publish:
        description: >-
          Publish the wheels and sdist to PyPI. Also requires the repository variable
          ALLOW_BINARY_DISTRIBUTION == 'true' (pending patent-licensing review).
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  MANIFEST: crates/ticoraw-py/Cargo.toml

jobs:
  lint:
    name: rustfmt, clippy, MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # pyo3's build script needs an interpreter even for `cargo check`.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: dtolnay/rust-toolchain@1.85
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/ticoraw-py
      - run: cargo +stable fmt --manifest-path "$MANIFEST" --check
      - run: cargo +stable clippy --manifest-path "$MANIFEST" --locked --all-targets -- -D warnings
      - run: cargo +1.85 check --manifest-path "$MANIFEST" --locked --all-targets

  wheels:
    name: wheel (${{ matrix.platform }}-${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux, runner: ubuntu-latest, target: x86_64, manylinux: auto }
          - { platform: linux, runner: ubuntu-latest, target: aarch64, manylinux: auto }
          - { platform: macos, runner: macos-latest, target: aarch64 }
          - { platform: macos, runner: macos-latest, target: x86_64 }
          - { platform: windows, runner: windows-latest, target: x64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      # An interpreter for pyo3's build script (on Windows it also provides python3.lib).
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build abi3 wheel
        uses: PyO3/maturin-action@v1
        with:
          working-directory: crates/ticoraw-py
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --locked --out dist
      # Compiled decoders are uploaded only when binary distribution is allowed (see the
      # PATENT GATE above); the test jobs build their own wheels instead.
      - uses: actions/upload-artifact@v4
        if: vars.ALLOW_BINARY_DISTRIBUTION == 'true'
        with:
          name: wheels-${{ matrix.platform }}-${{ matrix.target }}
          path: crates/ticoraw-py/dist
          retention-days: 7

  sdist:
    name: sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: crates/ticoraw-py
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: crates/ticoraw-py/dist
          retention-days: 7

  test:
    name: test (${{ matrix.wheel }}, Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # abi3-py39: the oldest and the newest CPython load the same wheel.
          - { wheel: linux-x86_64, runner: ubuntu-latest, python: "3.9" }
          - { wheel: linux-x86_64, runner: ubuntu-latest, python: "3.x" }
          - { wheel: linux-aarch64, runner: ubuntu-24.04-arm, python: "3.x" }
          - { wheel: macos-aarch64, runner: macos-latest, python: "3.x" }
          - { wheel: macos-x86_64, runner: macos-15-intel, python: "3.x" }
          - { wheel: windows-x64, runner: windows-latest, python: "3.x" }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Build the wheel on this runner (never downloaded from another job)
        uses: PyO3/maturin-action@v1
        with:
          working-directory: crates/ticoraw-py
          args: --release --locked --out dist
      - name: Install the wheel
        shell: bash
        run: |
          python -m pip install numpy pytest
          # --no-index: install this run's wheel, never a `ticoraw` from PyPI.
          python -m pip install --no-index --no-deps --find-links crates/ticoraw-py/dist ticoraw
      - run: python -m pytest crates/ticoraw-py/tests -ra

  conformance:
    name: conformance samples (linux-x86_64)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the wheel on this runner (never downloaded from another job)
        uses: PyO3/maturin-action@v1
        with:
          working-directory: crates/ticoraw-py
          args: --release --locked --out dist
      - name: Install the wheel, rawpy and mypy
        run: |
          python -m pip install numpy pytest rawpy mypy
          python -m pip install --no-index --no-deps --find-links crates/ticoraw-py/dist ticoraw
      - name: Check the type stubs against the module
        run: python -m mypy.stubtest ticoraw
      # Same cache as conformance.yml.
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/conformance-samples
          key: conformance-samples-${{ hashFiles('conformance/manifest.toml') }}
          restore-keys: conformance-samples-
      - name: Fetch samples
        run: sh conformance/fetch.sh "$RUNNER_TEMP/conformance-samples"
      - name: Decode the samples from Python
        env:
          TICORAW_CONFORMANCE_DIR: ${{ runner.temp }}/conformance-samples
        run: python -m pytest crates/ticoraw-py/tests/test_conformance.py -ra

  publish:
    name: publish to PyPI (gated)
    needs: [lint, wheels, sdist, test, conformance]
    # PATENT GATE: both a manual dispatch with `publish` ticked AND the repository variable
    # ALLOW_BINARY_DISTRIBUTION == 'true' (unset today, pending patent-licensing review).
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.publish == true &&
      vars.ALLOW_BINARY_DISTRIBUTION == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/ticoraw
    permissions:
      contents: read
      id-token: write # PyPI trusted publishing; no API token is stored
    steps:
      - name: Re-check the patent gate
        env:
          EVENT: ${{ github.event_name }}
          PUBLISH: ${{ inputs.publish }}
          ALLOW: ${{ vars.ALLOW_BINARY_DISTRIBUTION }}
        run: |
          if [ "$EVENT" != workflow_dispatch ] || [ "$PUBLISH" != true ] || [ "$ALLOW" != true ]; then
            echo "Binary distribution is not allowed (pending patent-licensing review)." >&2
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
