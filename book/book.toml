# The ticoraw documentation website (mdBook 0.5.4). Build it with `mdbook build book`, or
# preview it with `mdbook serve book --open`; python3 is needed for the preprocessor below.
# The CLI reference is generated: scripts/docs/cli-help.sh. Links: scripts/docs/check_links.py.
[book]
title = "ticoraw"
description = "Convert Nikon HE and HE* raw files to DNG files that almost every raw editor opens: free, private and bit-exact."
authors = ["Luka Jovanovic", "ticoraw contributors"]
language = "en"
src = "src"

# Includes repository files (docs/FORMAT.md, CONTRIBUTING.md, ...) and rewrites their
# relative links so they keep working inside the book. Runs before mdBook's own includes.
[preprocessor.repo-include]
command = "python3 ../scripts/docs/repo_include.py"
before = ["links"]

[output.html]
default-theme = "light"
preferred-dark-theme = "navy"
smart-punctuation = true
git-repository-url = "https://github.com/lukaj99/ticoraw"
edit-url-template = "https://github.com/lukaj99/ticoraw/edit/main/book/{path}"
site-url = "/ticoraw/"
additional-css = ["css/custom.css"]
no-section-label = true
sidebar-header-nav = true

[output.html.playground]
# The crates are not on the Rust Playground; snippets are meant to be copied into a project.
runnable = false

[output.html.search]
enable = true
limit-results = 20
use-boolean-and = true
boost-title = 2
heading-split-level = 2

[output.html.fold]
enable = true
level = 1
