# ticoraw conformance manifest: public CC0 Nikon HE/HE* samples and the output a correct
# decoder must produce for each. See README.md in this directory.
#
# Format: a deliberately small TOML subset, so that any TOML library and the hand-written
# readers in fetch.sh and crates/ticoraw/tests/conformance.rs all read it the same way:
#   - top-level `key = value` lines, then one `[[sample]]` table per sample;
#   - values are basic strings without escapes, decimal integers, decimals, or one-line
#     arrays of integers;
#   - `#` starts a comment outside strings; one key per line.
#
# Expected values per sample:
#   nef_sha256          SHA-256 of the sample file as downloaded from `url`
#   nef_bytes           its size in bytes
#   width, height       CFA mosaic size in photosites (the whole raw IFD, no crop)
#   cfa_sha256          SHA-256 of the decoded mosaic: every sample as a little-endian u16,
#                       row-major, width * height * 2 bytes
#   cfa_pattern         2x2 CFA pattern, row-major
#   black_level         per 2x2 CFA position, row-major
#   white_level         saturation level
#   baseline_exposure   DNG BaselineExposure, EV
#   orientation         TIFF Orientation
#   crop                DNG DefaultCropOrigin and DefaultCropSize: [x, y, width, height]
#   unique_camera_model DNG UniqueCameraModel (the name Adobe uses for the body)
#
# "Adobe-verified": every cfa_sha256 below is also the SHA-256 of the CFA image in the DNG
# that `oracle` wrote from the same file, and every other expected value equals the tag
# that DNG carries. Adobe's DNGs are not distributed.

schema = 1
oracle = "Adobe DNG Converter 18.7 (build 2743), options -u -p0"

