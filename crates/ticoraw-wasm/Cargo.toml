[package]
name = "ticoraw-wasm"
description = "WebAssembly / JavaScript bindings for the ticoraw Nikon HE/HE* NEF decoder and DNG writer"
keywords = ["nikon", "nef", "raw", "dng", "wasm"]
categories = ["multimedia::images", "wasm"]
readme = "README.md"
# The npm package is assembled by scripts/build.sh. Compiled decoders are not published
# while patent licensing is under review (see README.md), and this crate is not for
# crates.io either.
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Single-threaded on purpose: wasm threads need nightly Rust and a cross-origin isolated
# page. Run one Web Worker per core instead (js/worker.js).
ticoraw = { path = "../ticoraw", version = "0.2.0", default-features = false }
ticoraw-dng = { path = "../ticoraw-dng", version = "0.2.0", default-features = false }
wasm-bindgen = "0.2.129"
js-sys = "0.3.106"

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3.79"

# wasm-pack runs wasm-opt after release builds (sizes are in README.md).
[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Oz"]

[lints]
workspace = true
